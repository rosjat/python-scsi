name: container

on:
  push:
    branches: ['**']
    # The image does not depend on the sources -- the repository is mounted at
    # run time -- so only rebuild when the image itself changes.
    paths:
      - 'containers/Containerfile'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'containers/Containerfile'
      - '.github/workflows/container.yml'
  # The transports are built from the tip of their repositories, so a new
  # cython-sgio or cython-iscsi commit is otherwise picked up only when the
  # Containerfile itself changes. Both move rarely enough that running this by
  # hand when they do beats rebuilding on a schedule that would almost always
  # find nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr; no PAT is needed.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # ghcr rejects an uppercase path, and github.repository_owner preserves
      # whatever case the account uses.
      - name: Resolve the image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/python-scsi-dev" >> "$GITHUB_OUTPUT"

      # Pin both transports to the commit that is current now. Passing `master`
      # would cache on that literal string, so the layer would be reused and the
      # image would keep whatever was built the first time. A SHA changes when
      # upstream does, which both busts the cache and records exactly what went
      # into the image.
      - name: Resolve the transport revisions
        id: transports
        run: |
          set -eu
          for repo in cython-sgio cython-iscsi; do
            sha=$(git ls-remote "https://github.com/python-scsi/${repo}.git" \
                    refs/heads/master | cut -f1)
            [ -n "$sha" ] || { echo "could not resolve ${repo} master" >&2; exit 1; }
            echo "${repo}: ${sha}"
            echo "${repo//-/_}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        # Skipped for pull requests: a fork's token is read-only, and a PR must
        # not be able to publish. The build below still runs, so the
        # Containerfile is verified either way.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/Containerfile
          build-args: |
            SGIO_REF=${{ steps.transports.outputs.cython_sgio }}
            ISCSI_REF=${{ steps.transports.outputs.cython_iscsi }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # Also export to the local daemon so the smoke test below can run it,
          # including on pull requests where nothing is pushed.
          load: true
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
          # Without this every run reinstalls apt and recompiles both Cython
          # extensions. With it, an unchanged build is close to instant.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Runs the locally loaded image, so this gates pull requests too. The
        # tgt-setup check needs no repository mounted, which is what proves the
        # harness is genuinely self-contained.
        env:
          IMAGE: ${{ steps.image.outputs.ref }}:latest
        run: |
          set -eu
          echo "--- every runtime, with the transport builds it got ---"
          docker run --rm "$IMAGE" bash -c '
            for v in $PYSCSI_VERSIONS; do
              "/opt/venv/$v/bin/python" -c "
          import sgio, iscsi
          from importlib.metadata import version
          print(\"  python $v  cython-sgio %-24s cython-iscsi %s\"
                % (version(\"cython-sgio\"), version(\"cython-iscsi\")))
          "
            done'

          echo "--- harness commands are on PATH ---"
          docker run --rm "$IMAGE" \
            bash -c 'command -v pyscsi-tgt-setup pyscsi-verify-tools pyscsi-verify-iscsi'

          echo "--- emulated targets come up with no repository mounted ---"
          docker run --rm "$IMAGE" pyscsi-tgt-setup

          echo "--- the repository's own tests pass in the image ---"
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" pytest -q
