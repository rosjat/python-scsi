name: tests

on:
  pull_request:
  push:
    # Every branch: this repository is developed on feature branches and forks,
    # so restricting to master would leave most work untested.
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Quoted deliberately: unquoted YAML reads 3.10 as the float 3.1.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from tags; a shallow clone has
          # none and yields a bogus 0.1.devN.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest -vv
      # --python-version is required: python_version in pyproject.toml pins the
      # analysis target, so without it every entry would re-check 3.11.
      - run: mypy --python-version ${{ matrix.python-version }}
