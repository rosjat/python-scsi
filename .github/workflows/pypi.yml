name: Publish to TestPyPI (and PyPI)

on:
  push:
    # Was `on: push`, which ran the whole build on every branch push while the
    # publish steps were tag-gated internally. Releases are tagged vX.Y.Z.
    tags: ['v*']
  # Lets a TestPyPI dry run be triggered without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tags to derive the release version.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install build
      - run: python -m build
      # upload-artifact and download-artifact are deliberately on different
      # majors -- that is where each currently sits, not a typo. v4 targets
      # Node 20, which the runners have deprecated.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    # Stays on an API token, deliberately.
    #
    # The PYSCSI project on test.pypi.org is owned by a different account, and
    # trusted publishing can only be configured by a project owner. The
    # long-standing TEST_PYPI_API_TOKEN secret does grant upload rights, so
    # that is what this uses. Do not "modernise" this job to OIDC -- it will
    # fail until ownership of the TestPyPI project changes.
    #
    # This uploads the same artifact the PyPI job will, so a failure here is a
    # genuine signal and correctly blocks the release below.
    name: Publish to TestPyPI (API token)
    needs: build
    # PUBLISH_TESTPYPI must be a *repository* variable, not an environment one:
    # a job-level if: is evaluated before the environment is resolved, so an
    # environment-scoped value reads as empty and silently skips the job.
    if: vars.PUBLISH_TESTPYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/PYSCSI
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # Note the hyphen: repository_url is the deprecated spelling.
          repository-url: https://test.pypi.org/legacy/
          # Re-running a workflow for an already-uploaded version is benign and
          # must not be mistaken for a real failure. Anything else still fails
          # the job, which gates the PyPI upload below.
          skip-existing: true

  pypi:
    # Trusted publishing: no stored secret, credentials minted per run and
    # scoped to this workflow file. Requires a trusted publisher configured on
    # pypi.org for the PYSCSI project (owner/repo/workflow/environment must
    # match exactly) -- adding it needs the Owner role there.
    #
    # PYPI_API_TOKEN is intentionally no longer referenced here, but must NOT
    # be revoked: other projects in the org share it.
    name: Publish to PyPI (trusted publishing)
    needs: [build, testpypi]
    # TestPyPI gates this job: if the dry run cannot upload, the artifact or
    # the upload path is wrong and must not reach PyPI.
    #
    # !cancelled() is required, not decorative. A skipped dependency normally
    # skips its dependents, so without it, leaving PUBLISH_TESTPYPI unset would
    # silently disable PyPI publishing too. A skipped TestPyPI job is
    # tolerated; a failed one is not. Also never runs for a manual dispatch.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.testpypi.result != 'failure'
      && vars.PUBLISH_PYPI == 'true'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PYSCSI
    permissions:
      # Mints the short-lived OIDC token used instead of an API token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the tag can be checked against master.
          fetch-depth: 0
      # A tag alone is not enough to authorise a release: without this, tagging
      # any feature branch would publish it.
      #
      # master is hardcoded on purpose. Resolving it from the repository's
      # default branch would make the safeguard follow whatever the default is
      # set to, so a fork with a working branch as its default would accept a
      # tag on that branch. Releases only ever come from master.
      - name: Refuse to publish a tag that is not merged into master
        env:
          DEFAULT_BRANCH: master
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $GITHUB_REF_NAME is on $DEFAULT_BRANCH; proceeding."
          else
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not"\
                 "merged into $DEFAULT_BRANCH. Refusing to publish to PyPI."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # No `password:` -- authentication is the OIDC token minted above.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
